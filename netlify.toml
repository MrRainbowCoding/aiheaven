[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["prompts/data/*.md"]

[dev]
  command = "npm start"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/server/health"
  status = 200
