<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heaven — Prompts</title>
  <style>
    :root { --ink: #1d222b; --muted: #78808d; --line: #e8e7e4; --paper: #fbfaf8; --purple: #6f45e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font: 15px/1.5 Inter, system-ui, sans-serif; }
    .page { width: min(940px, calc(100% - 48px)); margin: 0 auto; padding: 46px 0; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 42px; }
    .back { color: var(--muted); font-size: 12px; text-decoration: none; }
    .back:hover { color: var(--purple); }
    h1 { margin: 21px 0 7px; font-size: 42px; letter-spacing: -.06em; line-height: 1; }
    .intro { margin: 0; color: var(--muted); }
    .count { color: var(--muted); font-size: 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .card { display: flex; flex-direction: column; min-height: 210px; padding: 19px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 12px 30px #261f4308; }
    .identity { display: flex; align-items: center; gap: 11px; }
    .avatar { display: grid; place-items: center; width: 39px; height: 39px; overflow: hidden; color: #fff; border-radius: 11px; background: var(--purple); font-weight: 750; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-weight: 700; }
    .file { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .description { flex: 1; margin: 18px 0; color: #666b75; font-size: 13px; }
    .copy { padding: 9px 12px; color: #fff; border: 0; border-radius: 8px; background: var(--purple); font-size: 12px; font-weight: 650; }
    .copy:hover { background: #5e37d2; }
    .empty { padding: 48px 20px; color: var(--muted); border: 1px dashed #d9d6d1; border-radius: 14px; text-align: center; }
    .error { color: #a64e4e; }
    @media (max-width: 600px) { .page { width: calc(100% - 32px); padding-top: 28px; } h1 { font-size: 36px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <div><a class="back" href="/">← Back to chat</a><h1>Prompts</h1><p class="intro">Reusable starting points for better conversations.</p></div>
      <span class="count" id="count"></span>
    </div>
    <section class="grid" id="promptGrid"><div class="empty">Loading prompts…</div></section>
  </main>
  <script>
    const grid = document.getElementById("promptGrid");
    const count = document.getElementById("count");
    function escapeHtml(value) { return value.replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]); }
    function render(prompts) {
      count.textContent = `${prompts.length} ${prompts.length === 1 ? "prompt" : "prompts"}`;
      if (!prompts.length) { grid.innerHTML = '<div class="empty">No prompts yet. Add Markdown files to <code>prompts/data</code>.</div>'; return; }
      grid.innerHTML = prompts.map((prompt) => {
        const avatar = prompt.profilePicture ? `<img src="${escapeHtml(prompt.profilePicture)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : escapeHtml(prompt.name.charAt(0).toUpperCase());
        return `<article class="card"><div class="identity"><div class="avatar">${avatar}</div><div><div class="name">${escapeHtml(prompt.name)}</div><div class="file">${escapeHtml(prompt.id)}.md</div></div></div><p class="description">${escapeHtml(prompt.description || "No description provided.")}</p><button class="copy" type="button" data-prompt="${encodeURIComponent(prompt.prompt)}">Copy prompt</button></article>`;
      }).join("");
      grid.querySelectorAll(".copy").forEach((button) => button.addEventListener("click", async () => {
        await navigator.clipboard.writeText(decodeURIComponent(button.dataset.prompt));
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = "Copy prompt"; }, 1400);
      }));
    }
    fetch("/api/prompts").then((response) => { if (!response.ok) throw new Error("Prompt API failed"); return response.json(); }).then(render).catch(() => { grid.innerHTML = '<div class="empty error">Prompts could not be loaded right now.</div>'; });
  </script>
</body>
</html>
